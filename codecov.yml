# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is produced by `pnpm run test:coverage` (Vitest, v8 provider) and
# uploaded by `.github/workflows/ci.yml`. The `include`/`exclude` set that
# decides which files are measured lives in `apps/rights-web/vitest.config.ts`; this file only
# decides how Codecov reports on them.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "20...80"
  status:
    project:
      default:
        target: auto
        # Small refactors should not fail the build over rounding noise.
        threshold: 2%
        informational: true
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

# One flag per feature module of apps/rights-web, so the Codecov UI can show
# which one a change actually moved the needle in. Kept in sync with
# `apps/rights-web/components/*` and `apps/rights-web/lib/*`.
flag_management:
  default_rules:
    carryforward: true

flags:
  animations:
    paths:
      - apps/rights-web/components/animations
  auth:
    paths:
      - apps/rights-web/lib/auth
  cause:
    paths:
      - apps/rights-web/components/cause
  contract-builder:
    paths:
      - apps/rights-web/components/contract-builder
  credit:
    paths:
      - apps/rights-web/components/credit
  db:
    paths:
      - apps/rights-web/lib/db
  env:
    paths:
      - apps/rights-web/lib/env
  innovation-timeline:
    paths:
      - apps/rights-web/components/innovation-timeline
  investor-rank:
    paths:
      - apps/rights-web/components/investor-rank
  prosper-coin:
    paths:
      - packages/prosper-coin
  prosper-license:
    paths:
      - apps/rights-web/components/prosper-license
  site-shell:
    paths:
      - apps/rights-web/components/site-shell
  startup-tools:
    paths:
      - apps/rights-web/components/startup-tools
  terms-privacy:
    paths:
      - apps/rights-web/components/terms-privacy
  text-effects:
    paths:
      - apps/rights-web/components/text-effects
  ui:
    paths:
      - apps/rights-web/components/ui
  app:
    paths:
      - apps/rights-web/app
  lib:
    paths:
      - apps/rights-web/lib

# Components mirror the flags above so the "components" section of the PR
# comment (below) has something to render, and so each package gets its own
# informational status check independent of the project-wide one.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
        informational: true
  individual_components:
    - component_id: animations
      paths:
        - apps/rights-web/components/animations
    - component_id: auth
      paths:
        - apps/rights-web/lib/auth
    - component_id: cause
      paths:
        - apps/rights-web/components/cause
    - component_id: contract-builder
      paths:
        - apps/rights-web/components/contract-builder
    - component_id: credit
      paths:
        - apps/rights-web/components/credit
    - component_id: db
      paths:
        - apps/rights-web/lib/db
    - component_id: env
      paths:
        - apps/rights-web/lib/env
    - component_id: innovation-timeline
      paths:
        - apps/rights-web/components/innovation-timeline
    - component_id: investor-rank
      paths:
        - apps/rights-web/components/investor-rank
    - component_id: prosper-coin
      paths:
        - packages/prosper-coin
    - component_id: prosper-license
      paths:
        - apps/rights-web/components/prosper-license
    - component_id: site-shell
      paths:
        - apps/rights-web/components/site-shell
    - component_id: startup-tools
      paths:
        - apps/rights-web/components/startup-tools
    - component_id: terms-privacy
      paths:
        - apps/rights-web/components/terms-privacy
    - component_id: text-effects
      paths:
        - apps/rights-web/components/text-effects
    - component_id: ui
      paths:
        - apps/rights-web/components/ui
    - component_id: app
      paths:
        - apps/rights-web/app
    - component_id: lib
      paths:
        - apps/rights-web/lib

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false

# Mirrors apps/rights-web/vitest.config.ts's coverage.exclude, so the two do not disagree about
# what counts. Route shells and the re-export barrels carry no logic to cover.
ignore:
  - "**/*.test.{ts,tsx}"
  - "**/*.d.ts"
  - "**/node_modules/**"
  - "apps/rights-web/app/**/page.tsx"
  - "apps/rights-web/app/**/layout.tsx"
  - "apps/rights-web/app/error.tsx"
  - "apps/rights-web/app/not-found.tsx"
  - "apps/rights-web/components/*/index.ts"
  - "apps/rights-web/lib/*/index.ts"
  - "apps/rights-web/test/**"
